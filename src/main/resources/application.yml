spring:
  application:
    name: fleet-telemetry-backend

  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0

management:
  endpoint:
    health:
      show-details: never

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - circuitbreakers
          - circuitbreakerevents

      cors:
        allowed-origins:
          - "http://localhost:5173"
          - "http://localhost:5174"
        allowed-methods:
          - GET
          - OPTIONS
        allowed-headers:
          - "*"

  health:
    circuitbreakers:
      enabled: true

info:
  app:
    name: Fleet Telemetry Backend
    description: Fleet telemetry and monitoring system
    version: 0.0.1

route-service:
  base-url: ${ROUTE_SERVICE_BASE_URL:http://localhost:8080}

resilience4j:
  circuitbreaker:
    instances:
      route-service:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2