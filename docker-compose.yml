services:
  postgres:
    image: postgres:17-alpine
    container_name: fleet-telemetry-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-telemetry}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fleet-telemetry-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: fleet-telemetry-backend
    container_name: fleet-telemetry-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}

      APP_ENV: ${APP_ENV:-local}
      APP_NAME: fleet-telemetry-backend
      SERVER_PORT: 8080

      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-telemetry}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}

      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}

      ROUTE_SERVICE_BASE_URL: ${ROUTE_SERVICE_BASE_URL:-http://backend:8080}

    ports:
      - "8080:8080"

    restart: unless-stopped

volumes:
  postgres_data: